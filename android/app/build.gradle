plugins { id 'com.android.application' }
def signingFile = rootProject.file('../../WiizV_signing/release.properties')
def releaseKeys = new Properties()
if (signingFile.isFile()) signingFile.withInputStream { releaseKeys.load(it) }
def releaseKeysReady = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].every { releaseKeys.getProperty(it) }
android {
    namespace 'com.wiizv.app'
    compileSdk 35
    ndkVersion '30.0.16248370'
    defaultConfig {
        applicationId 'com.wiizv.app'
        minSdk 23
        targetSdk 35
        versionCode 12
        versionName '0.2.4'
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared'; targets 'main', 'wiizv_snes9x' } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '4.1.2' } }
    packagingOptions { jniLibs { useLegacyPackaging true } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs {
        release {
            if (releaseKeysReady) {
                storeFile new File(signingFile.parentFile, releaseKeys.getProperty('storeFile'))
                storePassword releaseKeys.getProperty('storePassword')
                keyAlias releaseKeys.getProperty('keyAlias')
                keyPassword releaseKeys.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug { debuggable true }
        release { debuggable false; minifyEnabled false; signingConfig signingConfigs.release }
    }
}
tasks.matching { it.name == 'preReleaseBuild' }.configureEach {
    doFirst {
        if (!releaseKeysReady) throw new GradleException('Release signing is missing. Run tools/initialize-android-signing.ps1 once, or restore ../WiizV_signing from backup.')
    }
}
